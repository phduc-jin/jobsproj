server:

  port: 5001

spring:
  application:
    name: job-portal-user-service
  datasource:
    url: jdbc:postgresql://localhost:5432/job_portal
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
